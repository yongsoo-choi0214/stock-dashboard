    stat_code: "802Y001"
    item_code: "0088000"
    cycle: D
    unit_in: 억원
    unit_out: 조원
    scale: 1.0e-4

  - key: kosdaq_value
    name: 코스닥시장 거래대금
    stat_code: "802Y001"
    item_code: "0091000"
    cycle: D
    unit_in: 억원
    unit_out: 조원
    scale: 1.0e-4

  - key: foreign_net_kospi
    name: 외국인 순매수(유가증권)
    stat_code: "802Y001"
    item_code: "0030000"
    cycle: D
    unit_in: 억원
    unit_out: 조원
    scale: 1.0e-4

  - key: foreign_net_kosdaq
    name: 외국인 순매수(코스닥)
    stat_code: "802Y001"
    item_code: "0113000"
