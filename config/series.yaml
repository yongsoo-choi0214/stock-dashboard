# 수집 대상 시리즈 선언. 코드에 시리즈 ID를 하드코딩하지 않는다 (CLAUDE.md 설계원칙 3).
fred:
  - id: WALCL
    name: 연준 총자산
    unit_in: million_usd
    unit_out: billion_usd
    scale: 0.001          # ★ 백만 → 십억 (§7.4)
    freq: W
    expect_range: [500.0, 12000.0]
  - id: WTREGEN
    name: 재무부 일반계정(TGA)
    # ★ CLAUDE.md §7.4는 이 시리즈를 billion 이라 적었으나 실제로는 million 이다.
    #    검증: 원시 최대값 1,816,687 = 2020년 COVID 당시 TGA $1.82조. billion이면 불가능.
    unit_in: million_usd
    unit_out: billion_usd
    scale: 0.001
    freq: W
    expect_range: [1.0, 3000.0]     # 십억 USD 기준 상식 범위 (단위 사고 방지)
  - id: RRPONTSYD
    name: 익일물 역레포(ON RRP)
    unit_in: billion_usd
    unit_out: billion_usd
    scale: 1.0
    freq: D
    expect_range: [0.0, 3000.0]
  - id: M2SL
    name: 미국 M2
    unit_in: billion_usd
    unit_out: billion_usd
    scale: 1.0
    freq: M
    publication_lag_days: 30      # ★ 백테스트용 (§7.2)
  - id: DFF
    name: 연방기금 실효금리
    unit_in: percent
    unit_out: percent
    scale: 1.0
    freq: D
  - id: T10Y2Y
    name: 미국 10Y-2Y 스프레드
    unit_in: percent
    unit_out: percent
    scale: 1.0
    freq: D
  - id: BAMLH0A0HYM2
    name: 하이일드 OAS
    unit_in: percent
    unit_out: percent
    scale: 1.0
    freq: D
    # ★ ICE BofA 라이선스 계열이라 공개 범위가 최근 3년뿐이다(키가 있어도 동일).
    #    조정 8회 중 2회만 덮어 백테스트에 쓸 수 없다 → BAA10Y 로 대체.

  # 신용 스프레드 — 조정의 고전적 선행지표.
  # 무디스 계열은 라이선스 제약이 없어 1990년부터 나온다(9,150행).
  - id: BAA10Y
    name: 무디스 Baa - 10년물 스프레드
    unit_in: percent
    unit_out: percent
    scale: 1.0
    freq: D
    expect_range: [0.0, 10.0]
  - id: AAA10Y
    name: 무디스 Aaa - 10년물 스프레드
    unit_in: percent
    unit_out: percent
    scale: 1.0
    freq: D
    expect_range: [0.0, 8.0]
  - id: T10Y3M
    name: 미국 10Y-3M 스프레드
    unit_in: percent
    unit_out: percent
    scale: 1.0
    freq: D
    expect_range: [-6.0, 6.0]

# ecos: 아래 코드는 StatisticTableList / StatisticItemList 로 탐색해 확정하고
#       StatisticSearch 로 실제 값까지 확인한 것이다 (Phase 1).
#
# 금액 계열은 모두 **조원**으로 통일한다. 단위 정규화는 ETL에서 끝낸다(설계원칙 4).
# deposit_ratio(예탁금/시총), deposit_turnover(거래대금/예탁금) 가 단위 일치를
# 전제로 하므로, 여기서 어긋나면 지표가 조용히 틀린다.
ecos:
  - key: m2
    name: 한국 M2(평잔, 원계열)
    stat_code: "161Y006"
    item_code: "BBHA00"
    cycle: M
    unit_in: 십억원
    unit_out: 조원
    scale: 0.001
    publication_lag_days: 60      # ★ 백테스트 시 shift 필요 (§7.2)

  - key: base_rate
    name: 한국은행 기준금리
    stat_code: "722Y001"
    item_code: "0101000"
    cycle: D
    unit_in: 연%
    unit_out: percent
    scale: 1.0
    expect_range: [0.0, 25.0]

  - key: usdkrw
    name: 원/달러 환율(매매기준율)
    stat_code: "731Y001"
    item_code: "0000001"
    cycle: D
    unit_in: 원
    unit_out: 원
    scale: 1.0
    expect_range: [500.0, 3000.0]

  # 투자자예탁금은 '증시주변자금동향'(901Y056)에 있고 **월간만** 제공된다.
  # 일간이 필요하면 KOFIA(freesis)를 붙여야 한다 — CLAUDE.md 의 kofia.py.
  - key: investor_deposit
    name: 투자자 예탁금
    stat_code: "901Y056"
    item_code: "S23A"
    cycle: M
    unit_in: 원
    unit_out: 조원
    scale: 1.0e-12
    expect_range: [1.0, 500.0]

  # --- 802Y001 '주식시장(일)' — 일간. 유동성 지표의 분모/분자가 여기서 나온다 ---
