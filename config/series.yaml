# 수집 대상 시리즈 선언. 코드에 시리즈 ID를 하드코딩하지 않는다 (CLAUDE.md 설계원칙 3).
fred:
  - id: WALCL
    name: 연준 총자산
    unit_in: million_usd
    unit_out: billion_usd
    scale: 0.001          # ★ 백만 → 십억 (§7.4)
    freq: W
  - id: WTREGEN
    name: 재무부 일반계정(TGA)
    unit_in: billion_usd
    unit_out: billion_usd
    scale: 1.0
    freq: W
  - id: RRPONTSYD
    name: 익일물 역레포(ON RRP)
    unit_in: billion_usd
    unit_out: billion_usd
    scale: 1.0
    freq: D
  - id: M2SL
    name: 미국 M2
    unit_in: billion_usd
    unit_out: billion_usd
    scale: 1.0
    freq: M
    publication_lag_days: 30      # ★ 백테스트용 (§7.2)
  - id: DFF
    name: 연방기금 실효금리
    unit_in: percent
    unit_out: percent
    scale: 1.0
    freq: D
  - id: T10Y2Y
    name: 미국 10Y-2Y 스프레드
    unit_in: percent
    unit_out: percent
    scale: 1.0
    freq: D
  - id: BAMLH0A0HYM2
    name: 하이일드 OAS
    unit_in: percent
    unit_out: percent
    scale: 1.0
    freq: D

# ecos: 통계표코드/항목코드는 하드코딩하지 말고
